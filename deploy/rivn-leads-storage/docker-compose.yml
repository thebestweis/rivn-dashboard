services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGREST_DB_PASSWORD: ${POSTGREST_DB_PASSWORD}
    volumes:
      - rivn_leads_postgres:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - storage

  postgrest:
    image: postgrest/postgrest:v14.16
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGREST_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      PGRST_SERVER_PORT: 3000
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_DB_POOL: 10
    networks:
      - storage

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - postgrest
    ports:
      - "127.0.0.1:${RIVN_LEADS_STORAGE_PORT:-3001}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - storage

networks:
  storage:
    driver: bridge

volumes:
  rivn_leads_postgres:
